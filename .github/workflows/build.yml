name: Build Desktop Apps

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller certifi
      - name: Build macOS .app
        run: |
          cd python_tool
          bash build_mac.sh
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HttpPostTool.app HttpPostTool-macOS.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: HttpPostTool-macOS
          path: python_tool/dist/HttpPostTool-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller certifi
      - name: Build Windows .exe
        shell: cmd
        run: |
          cd python_tool
          call build_win.bat
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: HttpPostTool-Windows
          path: python_tool/dist/HttpPostTool.exe
